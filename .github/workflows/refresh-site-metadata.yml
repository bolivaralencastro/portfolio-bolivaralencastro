name: Refresh Site Metadata

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'blog/*.html'
      - 'projects/*.html'
      - 'style.css'
      - 'assets/js/*.js'
      - 'scripts/*.py'
      - 'robots.txt'

jobs:
  refresh-site-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate sitemap, feed and editorial blocks
        run: python scripts/build_site_metadata.py

      - name: Ensure generated files were committed locally
        run: |
          FILES=(
            sitemap.xml
            feed.xml
            feed.txt
            index.html
            about.html
            blog.html
            projects.html
            now.html
            blog/*.html
            projects/*.html
          )

          if ! git diff --quiet -- "${FILES[@]}"; then
            echo "Generated metadata files changed after running build_site_metadata.py."
            echo "Run python3 scripts/build_site_metadata.py locally, commit the result, and push again."
            git diff --stat -- "${FILES[@]}"
            exit 1
          fi

          echo "Generated metadata files are up to date."

      - name: Validate generated result
        run: python scripts/validate_site.py
