name: Validate Content

on:
  pull_request:
  push:

jobs:
  validate-content:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run the complete publication check
        run: python scripts/check_before_publish.py
